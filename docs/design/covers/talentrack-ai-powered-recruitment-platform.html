html, body {
  margin: 0;
  width: 1600px;
  height: 900px;

  background: #000;
}
body { position: relative; }
figure {
  position: absolute;
  margin: 0;
  overflow: hidden;
  background: #000;
}
img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
.board {
  display: grid;
  position: absolute;
  left: 50%;
  top: 50%;
}
.board figure { position: relative; }
.veil {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}
